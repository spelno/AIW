<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Wellness & Nutrition Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-gradient: linear-gradient(135deg, #10b981 0%, #047857 100%);
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* Mencegah Scroll pada Halaman Utama */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 12px;
            box-sizing: border-box;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        h2 { font-size: 22px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        h3 { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 13px; margin-top: 0; }
        
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; margin-top: 10px; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            margin-top: 14px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        button:hover { opacity: 0.95; }
        
        .btn-guest { background: #64748b !important; margin-top: 8px; }
        .btn-danger { background: #ef4444 !important; width: auto; padding: 6px 10px; font-size: 11px; margin: 0; box-shadow: none !important; }

        .hidden { display: none !important; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            background: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .user-greeting { font-weight: 700; color: var(--primary); font-size: 14px; margin: 0; }

        /* Dashboard Grid 2-3 Baris Tanpa Scroll */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .menu-thumb-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-align: center;
            padding: 12px 8px;
            transition: transform 0.15s;
        }
        .menu-thumb-card:hover { transform: translateY(-2px); border-color: #10b981; }
        
        /* Kartu Terakhir (Tanya AI) Dibuat Melebar 2 Kolom */
        .menu-thumb-card.wide {
            grid-column: span 2;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            text-align: left;
        }
        .menu-thumb-img {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #f1f5f9;
            margin: 0 auto 6px auto;
            display: block;
        }
        .menu-thumb-card.wide .menu-thumb-img {
            margin: 0 12px 0 0;
            width: 40px;
            height: 40px;
        }
        .menu-thumb-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }
        
        .list-item-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <!-- HALAMAN LOGIN -->
        <div id="loginSection" class="card" style="text-align: center;">
            <div style="margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center;">
                <img src="Logo.PNG" alt="Logo" style="width: 65px; height: 65px; border-radius: 16px; object-fit: cover; box-shadow: 0 6px 12px rgba(0,0,0,0.1);" onerror="this.style.display='none'">
            </div>
            <h2>Wellness Hub</h2>
            <p style="margin-bottom: 16px;">Asisten Gizi & Kesehatan Pribadi</p>
            
            <div style="text-align: left;">
                <label>Username</label>
                <input type="text" id="username" placeholder="cth: OD">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password">
            </div>
            
            <button onclick="handleLogin()">Masuk</button>
            <button class="btn-guest" onclick="handleGuestLogin()">Masuk sebagai Guest</button>
        </div>

        <!-- DASHBOARD UTAMA (2-3 BARIS TANPA SCROLL) -->
        <div id="dashboardSection" class="hidden" style="width: 100%;">
            <div class="dashboard-header">
                <div>
                    <p style="margin:0; font-size: 11px; color: var(--text-muted);">Halo,</p>
                    <h3 id="welcomeUser" class="user-greeting" style="margin:0;">User</h3>
                </div>
                <button class="btn-danger" onclick="handleLogout()">Keluar</button>
            </div>

            <div id="mainMenuGrid" class="card" style="padding: 14px;">
                <h3 style="margin-bottom: 10px; font-size: 14px;">Menu Utama</h3>
                <div class="dashboard-grid">
                    
                    <div class="menu-thumb-card" onclick="openModule('tabMealPlan')">
                        <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Menu">
                        <div class="menu-thumb-title">Daftar Menu</div>
                    </div>

                    <div class="menu-thumb-card" onclick="openModule('tabFoodLog')">
                        <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Catat">
                        <div class="menu-thumb-title">Catat Makanan</div>
                    </div>

                    <div class="menu-thumb-card" onclick="openModule('tabPantry')">
                        <img src="https://images.unsplash.com/photo-1584776296944-ab6fb579cfff?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Stok">
                        <div class="menu-thumb-title">Stok Dapur</div>
                    </div>

                    <div class="menu-thumb-card" onclick="openModule('tabMedical')">
                        <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Medis">
                        <div class="menu-thumb-title">Rekam Medis</div>
                    </div>

                    <div class="menu-thumb-card wide" onclick="openModule('tabAI')">
                        <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="AI">
                        <div class="menu-thumb-title">Tanya AI & Konsultasi</div>
                    </div>

                </div>
            </div>

            <!-- MODUL 1: DAFTAR MENU -->
            <div id="tabMealPlan" class="app-tab hidden card">
                <h3>Rencana Makanan</h3>
                <div id="mealPlanContainer" style="max-height: 220px; overflow-y: auto;">
                    <p style="text-align: center; color: var(--text-muted); padding: 10px 0;">Memuat menu...</p>
                </div>
            </div>

            <!-- MODUL 2: CATAT MAKANAN -->
            <div id="tabFoodLog" class="app-tab hidden card" style="max-height: 80vh; overflow-y: auto;">
                <h3>Catat Makanan & Foto</h3>
                <label>Foto Makanan</label>
                <input type="file" id="foodPhoto" accept="image/*">
                <button onclick="processFoodPhoto()" style="background: #3b82f6; margin-top: 8px;">Analisis AI</button>
                
                <label>Waktu Makan</label>
                <select id="waktuMakan">
                    <option value="Sarapan">Sarapan</option>
                    <option value="Makan Siang">Makan Siang</option>
                    <option value="Makan Malam">Makan Malam</option>
                    <option value="Cemilan">Cemilan</option>
                </select>
                
                <label>Nama Makanan</label>
                <input type="text" id="namaMakanan" placeholder="cth: Nasi Merah + Ayam">
                
                <label>Porsi (Gram)</label>
                <input type="number" id="porsiGram" value="100">
                
                <label>Kalori (kkal)</label>
                <input type="number" id="kalori" value="0">
                
                <button onclick="submitFoodLog()">Simpan</button>
            </div>

            <!-- MODUL 3: STOK DAPUR -->
            <div id="tabPantry" class="app-tab hidden card">
                <h3>Stok Dapur</h3>
                <label>Nama Bahan / Bumbu</label>
                <input type="text" id="namaBahan" placeholder="cth: Bawang Putih">
                <label>Kategori</label>
                <input type="text" id="kategoriBahan" placeholder="cth: Bumbu">
                <label>Jumlah</label>
                <input type="number" id="jumlahBahan" placeholder="cth: 5">
                <label>Satuan</label>
                <input type="text" id="satuanBahan" placeholder="cth: Siung">
                <button onclick="submitPantry()">Tambah Stok</button>
            </div>

            <!-- MODUL 4: REKAM MEDIS -->
            <div id="tabMedical" class="app-tab hidden card">
                <h3>Rekam Medis & Lab</h3>
                <label>Tanggal</label>
                <input type="date" id="medDate">
                <label>Jenis Pemeriksaan</label>
                <input type="text" id="jenisTes" placeholder="cth: Tes Darah">
                <label>Hasil</label>
                <input type="text" id="parameterHasil" placeholder="cth: Kolesterol 190">
                <label>Catatan</label>
                <textarea id="catatanDokter" placeholder="Catatan..." rows="2"></textarea>
                <button onclick="submitMedical()">Simpan</button>
            </div>

            <!-- MODUL 5: TANYA AI -->
            <div id="tabAI" class="app-tab hidden card">
                <h3>Konsultasi AI</h3>
                <label>Pertanyaan</label>
                <textarea id="aiQuestion" placeholder="Tanyakan sesuatu..." rows="3"></textarea>
                <button onclick="askAI()">Kirim</button>
                <div id="aiResponseContainer" style="margin-top: 10px; background: #ecfdf5; padding: 10px; border-radius: 10px; border-left: 3px solid var(--primary); display:none; font-size: 12px;">
                    <strong style="color: #047857;">Jawaban:</strong>
                    <p id="aiReplyText" style="margin: 4px 0 0 0;"></p>
                </div>
            </div>

        </div>

    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwp2yRMNgth4eyL543ZubMsxIrUnZJO82ZhrdhL0Wgl1L5JvIxqaP2Ti_rK-pOkNv01/exec"; 

        let currentUser = localStorage.getItem('loggedUser') || null;

        window.onload = function() {
            if (currentUser) {
                showDashboard();
            }
        }

        function handleLogin() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", username: user, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    currentUser = data.user;
                    localStorage.setItem('loggedUser', currentUser);
                    showDashboard();
                } else {
                    alert(data.message);
                }
            })
            .catch(err => alert("Gagal terhubung ke server: " + err));
        }

        function handleGuestLogin() {
            currentUser = "Guest";
            localStorage.setItem('loggedUser', currentUser);
            showDashboard();
        }

        function handleLogout() {
            localStorage.removeItem('loggedUser');
            currentUser = null;
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('welcomeUser').innerText = currentUser;
            document.getElementById('mainMenuGrid').classList.remove('hidden');
            document.querySelectorAll('.app-tab').forEach(el => el.classList.add('hidden'));
        }

        function openModule(tabId) {
            document.getElementById('mainMenuGrid').classList.add('hidden');
            document.querySelectorAll('.app-tab').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            if (tabId === 'tabMealPlan') {
                loadMealPlan();
            }
        }

        function loadMealPlan() {
            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getMealPlan", user: currentUser })
            })
            .then(res => res.json())
            .then(data => {
                let container = document.getElementById('mealPlanContainer');
                container.innerHTML = "";
                if (data.status === "success" && data.data.length > 0) {
                    data.data.forEach(item => {
                        let cardHTML = `
                            <div class="list-item-card">
                                <div style="font-weight: 700; color: var(--primary); font-size: 14px;">${item.namaMenu}</div>
                                <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">📅 ${item.hari} • ⏰ ${item.waktuMakan}</div>
                                <div style="margin-top: 6px;"><span style="background: #ecfdf5; color: #047857; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600;">Target: ${item.kaloriTarget} kkal</span></div>
                            </div>
                        `;
                        container.innerHTML += cardHTML;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color: var(--text-muted); padding: 10px 0;'>Belum ada rencana menu.</p>";
                }
            });
        }

        function processFoodPhoto() {
            let fileInput = document.getElementById('foodPhoto');
            if (fileInput.files.length === 0) {
                alert("Pilih foto terlebih dahulu!");
                return;
            }
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = function(e) {
                let base64Data = e.target.result.split(',')[1];
                alert("Menganalisis foto dengan AI...");
                fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "analyzeFoodPhoto", imageBase64: base64Data, mimeType: file.type })
                })
                .then(res => res.json())
                .then(resData => {
                    if (resData.status === "success") {
                        let info = resData.data;
                        document.getElementById('namaMakanan').value = info.namaMakanan || "";
                        document.getElementById('porsiGram').value = info.porsiGram || 100;
                        document.getElementById('kalori').value = info.kalori || 0;
                        alert("Analisis selesai!");
                    } else {
                        alert("Gagal menganalisis foto: " + resData.message);
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function submitFoodLog() {
            let payload = {
                action: "logFood",
                user: currentUser,
                waktuMakan: document.getElementById('waktuMakan').value,
                namaMakanan: document.getElementById('namaMakanan').value,
                porsi: document.getElementById('porsiGram').value,
                kalori: document.getElementById('kalori').value
            };
            fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => { alert(data.message); showDashboard(); });
        }

        function submitPantry() {
            let payload = {
                action: "updatePantry",
                user: currentUser,
                namaBahan: document.getElementById('namaBahan').value,
                kategori: document.getElementById('kategoriBahan').value,
                jumlah: document.getElementById('jumlahBahan').value,
                satuan: document.getElementById('satuanBahan').value
            };
            fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => { alert(data.message); showDashboard(); });
        }

        function submitMedical() {
            let payload = {
                action: "saveMedicalRecord",
                user: currentUser,
                tanggal: document.getElementById('medDate').value,
                jenisPemeriksaan: document.getElementById('jenisTes').value,
                parameter: document.getElementById('parameterHasil').value,
                catatan: document.getElementById('catatanDokter').value,
                rekomendasiAI: "Evaluasi mandiri"
            };
            fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => { alert(data.message); showDashboard(); });
        }

        function askAI() {
            let question = document.getElementById('aiQuestion').value;
            if (!question) return;
            alert("Mengirim pertanyaan ke Ahli Gizi AI...");
            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "askAI", question: question })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById('aiResponseContainer').style.display = "block";
                    document.getElementById('aiReplyText').innerText = data.reply;
                } else {
                    alert("Gagal mendapatkan jawaban.");
                }
            });
        }
    </script>
</body>
</html>
