<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Wellness & Nutrition Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-gradient: linear-gradient(135deg, #10b981 0%, #047857 100%);
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 16px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        
        /* Tema Login Biru-Hijau Segar dengan Logo Lepas */
        .login-body {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 40%, #10b981 100%);
            height: 100vh;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
            margin: auto;
        }
        .login-card label { color: var(--text-main); text-align: left; }
        .login-card input {
            background: #f8fafc;
            border: 2px solid var(--border-color);
            color: var(--text-main);
        }
        .login-card input:focus {
            border-color: #0284c7;
            background: #ffffff;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        h3 { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 13px; margin-top: 0; }
        
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; margin-top: 12px; }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        button:hover { opacity: 0.95; }
        
        .btn-guest { background: #64748b !important; margin-top: 8px; box-shadow: none !important; }
        .btn-danger { background: #ef4444 !important; width: auto; padding: 6px 12px; font-size: 11px; margin: 0; box-shadow: none !important; }
        
        /* Tombol Kembali di Sub-menu */
        .nav-bar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .btn-back {
            background: #e2e8f0;
            color: var(--text-main);
            width: auto;
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 10px;
            margin: 0;
            box-shadow: none !important;
            font-weight: 600;
        }
        .btn-back:hover { background: #cbd5e1; }

        .hidden { display: none !important; }

        /* Header Dashboard Baru (Logo di Kiri, Sapaan & Nama User di Kanan) */
        .dashboard-header-modern {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 14px 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .header-left-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo-small {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .header-user-info {
            text-align: right;
        }
        .user-greeting {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
            margin: 0;
        }

        /* Grid Dashboard Utama */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .menu-thumb-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-align: center;
            padding: 20px 12px;
            transition: transform 0.15s, border-color 0.15s;
        }
        .menu-thumb-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .menu-thumb-img {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            object-fit: cover;
            background-color: #f1f5f9;
            margin: 0 auto 10px auto;
            display: block;
        }
        .menu-thumb-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        
        .list-item-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body id="bodyTag" class="login-body">

    <div class="app-wrapper" id="wrapperTag">
        
        <!-- HALAMAN LOGIN DENGAN LOGO LEPAS -->
        <div id="loginSection" class="login-card">
            <div style="margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center;">
                <img src="Logo.png" alt="Logo" style="max-width: 140px; height: auto; object-fit: contain;" onerror="this.style.display='none'">
            </div>
            
            <div style="text-align: left;">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username">
                
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password">
            </div>
            
            <button onclick="handleLogin()">LOGIN</button>
            <button class="btn-guest" onclick="handleGuestLogin()">Masuk sebagai Guest</button>
        </div>

        <!-- DASHBOARD UTAMA -->
        <div id="dashboardSection" class="hidden" style="width: 100%;">
            
            <!-- Header Dashboard Modern (Logo di Kiri, Nama User di Kanan) -->
            <div class="dashboard-header-modern">
                <div class="header-left-brand">
                    <img src="Logo.png" alt="Logo" class="header-logo-small" onerror="this.style.display='none'">
                </div>
                <div class="header-user-info">
                    <p style="margin:0; font-size: 11px; color: var(--text-muted);">Halo,</p>
                    <h3 id="welcomeUser" class="user-greeting">User</h3>
                </div>
                <div>
                    <button class="btn-danger" onclick="handleLogout()">Keluar</button>
                </div>
            </div>

            <!-- Grid Menu Utama -->
            <div id="mainMenuGrid">
                <h3 style="margin-bottom: 12px; font-size: 15px; padding-left: 4px;">Fitur Utama</h3>
                <div class="dashboard-grid">
                    
                    <div class="menu-thumb-card" onclick="openModule('tabMealPlan')">
                        <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Menu">
                        <div class="menu-thumb-title">Daftar Menu</div>
                    </div>

                    <div class="menu-thumb-card" onclick="openModule('tabFoodLog')">
                        <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Catat">
                        <div class="menu-thumb-title">Catat Makanan</div>
                    </div>

                    <div class="menu-thumb-card" onclick="openModule('tabPantry')">
                        <img src="https://images.unsplash.com/photo-1584776296944-ab6fb579cfff?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Stok">
                        <div class="menu-thumb-title">Stok Dapur</div>
                    </div>

                    <div class="menu-thumb-card" onclick="openModule('tabMedical')">
                        <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=200&auto=format&fit=crop" class="menu-thumb-img" alt="Medis">
                        <div class="menu-thumb-title">Rekam Medis</div>
                    </div>

                </div>
            </div>

            <!-- MODUL 1: DAFTAR MENU -->
            <div id="tabMealPlan" class="app-tab hidden">
                <div class="nav-bar-top">
                    <button class="btn-back" onclick="backToDashboard()">← Kembali</button>
                </div>
                <div class="card">
                    <h3>Rencana Makanan</h3>
                    <div id="mealPlanContainer" style="max-height: 300px; overflow-y: auto;">
                        <p style="text-align: center; color: var(--text-muted); padding: 15px 0;">Memuat menu...</p>
                    </div>
                </div>
            </div>

            <!-- MODUL 2: CATAT MAKANAN -->
            <div id="tabFoodLog" class="app-tab hidden">
                <div class="nav-bar-top">
                    <button class="btn-back" onclick="backToDashboard()">← Kembali</button>
                </div>
                <div class="card">
                    <h3>Catat Makanan</h3>
                    <label>Waktu Makan</label>
                    <select id="waktuMakan">
                        <option value="Sarapan">Sarapan</option>
                        <option value="Makan Siang">Makan Siang</option>
                        <option value="Makan Malam">Makan Malam</option>
                        <option value="Cemilan">Cemilan</option>
                    </select>
                    
                    <label>Nama Makanan</label>
                    <input type="text" id="namaMakanan" placeholder="cth: Nasi Merah + Ayam">
                    
                    <label>Porsi (Gram)</label>
                    <input type="number" id="porsiGram" value="100">
                    
                    <label>Kalori (kkal)</label>
                    <input type="number" id="kalori" value="0">
                    
                    <button onclick="submitFoodLog()">Simpan Makanan</button>
                </div>
            </div>

            <!-- MODUL 3: STOK DAPUR -->
            <div id="tabPantry" class="app-tab hidden">
                <div class="nav-bar-top">
                    <button class="btn-back" onclick="backToDashboard()">← Kembali</button>
                </div>
                <div class="card">
                    <h3>Stok Dapur</h3>
                    <label>Nama Bahan / Bumbu</label>
                    <input type="text" id="namaBahan" placeholder="cth: Bawang Putih">
                    <label>Kategori</label>
                    <input type="text" id="kategoriBahan" placeholder="cth: Bumbu">
                    <label>Jumlah</label>
                    <input type="number" id="jumlahBahan" placeholder="cth: 5">
                    <label>Satuan</label>
                    <input type="text" id="satuanBahan" placeholder="cth: Siung">
                    <button onclick="submitPantry()">Tambah Stok</button>
                </div>
            </div>

            <!-- MODUL 4: REKAM MEDIS -->
            <div id="tabMedical" class="app-tab hidden">
                <div class="nav-bar-top">
                    <button class="btn-back" onclick="backToDashboard()">← Kembali</button>
                </div>
                <div class="card">
                    <h3>Rekam Medis & Lab</h3>
                    <label>Tanggal</label>
                    <input type="date" id="medDate">
                    <label>Jenis Pemeriksaan</label>
                    <input type="text" id="jenisTes" placeholder="cth: Tes Darah">
                    <label>Hasil</label>
                    <input type="text" id="parameterHasil" placeholder="cth: Kolesterol 190">
                    <label>Catatan</label>
                    <textarea id="catatanDokter" placeholder="Catatan dokter..." rows="3"></textarea>
                    <button onclick="submitMedical()">Simpan Rekam Medis</button>
                </div>
            </div>

        </div>

    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwp2yRMNgth4eyL543ZubMsxIrUnZJO82ZhrdhL0Wgl1L5JvIxqaP2Ti_rK-pOkNv01/exec"; 

        let currentUser = localStorage.getItem('loggedUser') || null;

        window.onload = function() {
            if (currentUser) {
                showDashboard();
            }
        }

        function handleLogin() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", username: user, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    currentUser = data.user;
                    localStorage.setItem('loggedUser', currentUser);
                    showDashboard();
                } else {
                    alert(data.message);
                }
            })
            .catch(err => alert("Gagal terhubung ke server: " + err));
        }

        function handleGuestLogin() {
            currentUser = "Guest";
            localStorage.setItem('loggedUser', currentUser);
            showDashboard();
        }

        function handleLogout() {
            localStorage.removeItem('loggedUser');
            currentUser = null;
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('bodyTag').classList.add('login-body');
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('bodyTag').classList.remove('login-body');
            document.getElementById('welcomeUser').innerText = currentUser;
            document.getElementById('mainMenuGrid').classList.remove('hidden');
            document.querySelectorAll('.app-tab').forEach(el => el.classList.add('hidden'));
        }

        function openModule(tabId) {
            document.getElementById('mainMenuGrid').classList.add('hidden');
            document.querySelectorAll('.app-tab').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            if (tabId === 'tabMealPlan') {
                loadMealPlan();
            }
        }

        function backToDashboard() {
            document.querySelectorAll('.app-tab').forEach(el => el.classList.add('hidden'));
            document.getElementById('mainMenuGrid').classList.remove('hidden');
        }

        function loadMealPlan() {
            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getMealPlan", user: currentUser })
            })
            .then(res => res.json())
            .then(data => {
                let container = document.getElementById('mealPlanContainer');
                container.innerHTML = "";
                if (data.status === "success" && data.data.length > 0) {
                    data.data.forEach(item => {
                        let cardHTML = `
                            <div class="list-item-card">
                                <div style="font-weight: 700; color: var(--primary); font-size: 14px;">${item.namaMenu}</div>
                                <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">📅 ${item.hari} • ⏰ ${item.waktuMakan}</div>
                                <div style="margin-top: 6px;"><span style="background: #ecfdf5; color: #047857; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600;">Target: ${item.kaloriTarget} kkal</span></div>
                            </div>
                        `;
                        container.innerHTML += cardHTML;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color: var(--text-muted); padding: 10px 0;'>Belum ada rencana menu.</p>";
                }
            });
        }

        function submitFoodLog() {
            let payload = {
                action: "logFood",
                user: currentUser,
                waktuMakan: document.getElementById('waktuMakan').value,
                namaMakanan: document.getElementById('namaMakanan').value,
                porsi: document.getElementById('porsiGram').value,
                kalori: document.getElementById('kalori').value
            };
            fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => { alert(data.message); backToDashboard(); });
        }

        function submitPantry() {
            let payload = {
                action: "updatePantry",
                user: currentUser,
                namaBahan: document.getElementById('namaBahan').value,
                kategori: document.getElementById('kategoriBahan').value,
                jumlah: document.getElementById('jumlahBahan').value,
                satuan: document.getElementById('satuanBahan').value
            };
            fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => { alert(data.message); backToDashboard(); });
        }

        function submitMedical() {
            let payload = {
                action: "saveMedicalRecord",
                user: currentUser,
                tanggal: document.getElementById('medDate').value,
                jenisPemeriksaan: document.getElementById('jenisTes').value,
                parameter: document.getElementById('parameterHasil').value,
                catatan: document.getElementById('catatanDokter').value
            };
            fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => { alert(data.message); backToDashboard(); });
        }
    </script>
</body>
</html>
